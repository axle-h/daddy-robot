apiVersion: apps/v1
kind: Deployment
metadata:
  name: daddy-robot
  labels:
    app: daddy-robot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daddy-robot
  template:
    metadata:
      labels:
        app: daddy-robot
    spec:
      enableServiceLinks: false
      # nginx-unprivileged runs as uid 101; restated so the cluster refuses root if the image changes.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: daddy-robot
          image: ghcr.io/axle-h/daddy-robot:latest
          # With `:latest`, a `rollout restart` picks up a new push; nothing watches the registry.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          # nginx's pid file and temp files are the only writes, and they all go to /tmp.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
