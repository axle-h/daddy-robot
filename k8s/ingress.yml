apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    # <namespace>-<middleware>@kubernetescrd: only resolves while the namespace is `daddy-robot`.
    traefik.ingress.kubernetes.io/router.middlewares: daddy-robot-redirect-http-https@kubernetescrd
  name: daddy-robot
  labels:
    app: daddy-robot
spec:
  ingressClassName: traefik
  rules:
    - host: "daddyrobot.ax-h.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: daddy-robot
                port:
                  name: http
  tls:
    - hosts:
        - daddyrobot.ax-h.com
      secretName: daddy-robot-axh-com-tls
