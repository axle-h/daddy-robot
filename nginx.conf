server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite puts a content hash in every name under /assets/, so these never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else falls back to the app, revalidated every time so a deploy is picked up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
