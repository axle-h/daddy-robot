# Builds the image, proves it serves the app the way Kubernetes runs it, and on main pushes it to
# ghcr.io for `k8s/` to pull. Nothing is pushed that has not passed the smoke test.
name: container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Lets GITHUB_TOKEN push to ghcr.io; making the package public is a one-off in its own settings.
  packages: write

# Must equal the image `k8s/daddy-robot/deployment.yml` pulls.
env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # A `docker-container` builder: the default `docker` driver cannot export the GHA cache below.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true # into the runner's docker, so the smoke test can run it
          tags: daddy-robot:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Exactly how the Deployment runs it: non-root, no capabilities, read-only root, /tmp writable.
      - name: Start the container the way Kubernetes will
        run: |
          docker run -d --name daddy-robot-ci \
            --read-only --tmpfs /tmp --cap-drop ALL --user 101:101 \
            -p 8080:8080 daddy-robot:ci

      - name: It serves the app
        timeout-minutes: 2
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then break; fi
            if [ "$i" = 30 ]; then echo "::error::/healthz never came up"; exit 1; fi
            sleep 1
          done

          # Catches a successful build with an empty `dist`.
          page=$(curl -fsS http://localhost:8080/)
          case "$page" in
            *'id="root"'*) echo "the page is there" ;;
            *) echo "::error::/ did not serve the app"; printf '%s\n' "$page" | head -20; exit 1 ;;
          esac

          script=$(printf '%s' "$page" | grep -o '/assets/[^"]*\.js' | head -1)
          headers=$(curl -fsSI "http://localhost:8080$script")
          case "$headers" in
            *immutable*) echo "$script is served and cached for good" ;;
            *) echo "::error::$script is missing or not cached as immutable"; printf '%s\n' "$headers"; exit 1 ;;
          esac

          deep=$(curl -fsS http://localhost:8080/some/where)
          case "$deep" in
            *'id="root"'*) echo "unknown paths fall back to the app" ;;
            *) echo "::error::/some/where did not fall back to index.html"; exit 1 ;;
          esac

      # Main only: a fork's pull request gets a read-only token, so this login would always fail.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          # Via the environment: `${{ }}` inside `run:` is pasted into the script before bash sees it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # Pushes the image that just ran rather than rebuilding it. `latest` is what the Deployment
      # pulls; the commit tag is the one to pin or roll back to.
      - name: Push it
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker tag daddy-robot:ci "$IMAGE:latest"
          docker tag daddy-robot:ci "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          echo "### Pushed \`$IMAGE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```shell' >> "$GITHUB_STEP_SUMMARY"
          echo "kubectl -n daddy-robot rollout restart deploy/daddy-robot" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs
        if: always()
        run: docker logs daddy-robot-ci 2>&1 | tail -50

      - name: Stop it
        if: always()
        run: docker rm -f daddy-robot-ci >/dev/null 2>&1 || true
