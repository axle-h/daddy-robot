# Checks and builds a `v*` tag, then publishes `dist/` to GitHub Pages. The `github-pages`
# environment only accepts refs its deployment rules allow, so a run from anything else is refused.
name: pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One deploy at a time, and a running one is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

      - name: Cache the pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      # `ci` does not run on tags, so nothing is published without these passing.
      - name: Check
        run: pnpm typecheck && pnpm lint && pnpm test

      - name: Build
        run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
